version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: personalfinance-postgres
    environment:
      POSTGRES_DB: PersonalFinanceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - personalfinance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/PersonalFinance.API/Dockerfile
    container_name: personalfinance-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=PersonalFinanceDb;Username=postgres;Password=postgres
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - personalfinance-network
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:

networks:
  personalfinance-network:
    driver: bridge
