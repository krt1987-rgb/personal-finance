<h2 mat-dialog-title>{{ mode === 'add' ? 'Add Stock' : 'Edit Stock' }}</h2>

<form [formGroup]="stockForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Stock Symbol</mat-label>
      <input matInput formControlName="symbol" placeholder="e.g., AAPL">
      <mat-error *ngIf="stockForm.get('symbol')?.hasError('required')">
        Symbol is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Company Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g., Apple Inc.">
      <mat-error *ngIf="stockForm.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" formControlName="quantity" placeholder="0">
      <mat-error *ngIf="stockForm.get('quantity')?.hasError('required')">
        Quantity is required
      </mat-error>
      <mat-error *ngIf="stockForm.get('quantity')?.hasError('min')">
        Quantity must be positive
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Average Price</mat-label>
      <input matInput type="number" formControlName="avgPrice" placeholder="0.00">
      <mat-error *ngIf="stockForm.get('avgPrice')?.hasError('required')">
        Average price is required
      </mat-error>
      <mat-error *ngIf="stockForm.get('avgPrice')?.hasError('min')">
        Price must be positive
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Current Price</mat-label>
      <input matInput type="number" formControlName="currentPrice" placeholder="0.00">
      <mat-error *ngIf="stockForm.get('currentPrice')?.hasError('required')">
        Current price is required
      </mat-error>
      <mat-error *ngIf="stockForm.get('currentPrice')?.hasError('min')">
        Price must be positive
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!stockForm.valid">
      {{ mode === 'add' ? 'Add' : 'Update' }}
    </button>
  </mat-dialog-actions>
</form>
