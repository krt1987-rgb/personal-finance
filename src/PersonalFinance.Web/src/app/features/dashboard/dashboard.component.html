<div class="dashboard">
  <h1>Dashboard</h1>
  
  <mat-grid-list cols="4" rowHeight="150px" gutterSize="16">
    @for (stat of stats; track stat.title) {
      <mat-grid-tile>
        <mat-card class="stat-card">
          <mat-card-content>
            <div class="stat-icon" [style.background-color]="stat.color">
              <mat-icon>{{ stat.icon }}</mat-icon>
            </div>
            <div class="stat-info">
              <h3>{{ stat.title }}</h3>
              <p class="stat-value">{{ stat.value }}</p>
            </div>
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>
    }
  </mat-grid-list>
  
  <div class="dashboard-content">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Recent Transactions</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="no-data">No recent transactions</p>
      </mat-card-content>
    </mat-card>
    
    <mat-card>
      <mat-card-header>
        <mat-card-title>Portfolio Performance</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="no-data">Chart will be displayed here</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
