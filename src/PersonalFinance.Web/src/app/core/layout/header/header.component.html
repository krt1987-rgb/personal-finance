<mat-toolbar color="primary">
  <button mat-icon-button (click)="onToggleSidebar()" aria-label="Toggle sidebar">
    <mat-icon>menu</mat-icon>
  </button>
  
  <span class="app-title">Personal Finance</span>
  
  <span class="spacer"></span>
  
  @if (isAuthenticated()) {
    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="User menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <div class="user-info">
        <p>{{ userName() }}</p>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item routerLink="/profile">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-menu-item routerLink="/settings">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  } @else {
    <button mat-button routerLink="/auth/login">Login</button>
    <button mat-raised-button color="accent" routerLink="/auth/register">Sign Up</button>
  }
</mat-toolbar>
